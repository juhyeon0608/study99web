<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperLab</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="local.css" />
</head>
<body data-auth="out">
  <!-- E9 서버에 연결할 수 없음 (디자인 11.4) — 30초마다 자동 재시도 -->
  <div class="gate" data-gate="local">
    <section class="gate-card" aria-labelledby="off-title">
      <div class="gate-brand"><svg class="gate-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="gm-bg" width="32" height="32" rx="8" fill="#1e3a8a"/><path d="M10 8h9l5 5v11a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="#fff"/><path class="gm-line" d="M12 17h8M12 21h6" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span class="gate-name">PaperLab</span></div>
      <div class="gate-pane" data-pane="local">
        <div class="gate-icon" data-tone="warn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7.5v5.5M12 16.5v.01"/></svg></div>
        <h1 class="gate-title" id="off-title" tabindex="-1" data-title>PaperLab 서버에 연결할 수 없어요</h1>
        <p class="gate-text" data-text>서버 PC가 꺼져 있거나 인터넷이 끊겼을 수 있어요. 관리자에게 알려 주세요.</p>
        <pre class="gate-detail hidden" data-detail></pre>
        <div class="status-line" role="status" data-count><span class="spinner" aria-hidden="true"></span><span data-count-text>30초 뒤에 다시 시도해요</span></div>
        <div class="gate-actions">
          <button type="button" class="btn primary" data-retry>다시 시도</button>
          <button type="button" class="btn ghost" data-logs>로그 폴더 열기</button>
        </div>
        <p class="gate-text small">연결되면 이 PC의 작업 받기도 이어서 해요.</p>
      </div>
    </section>
  </div>
  <script src="offline.js"></script>
</body>
</html>
