[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlab"
version = "0.1.0"
description = "설치형 논문 연구 도구: 검색·수집, 서재 관리, PDF 읽기·하이라이트, 인용, AI 요약과 Q&A"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "anthropic>=1.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
paperlab = "paperlab.__main__:main"

[tool.setuptools.packages.find]
include = ["paperlab*"]

[tool.setuptools.package-data]
paperlab = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
