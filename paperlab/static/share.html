<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>원고 보기 · PaperLab</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/share.css" />
  <script src="/static/vendor/marked.min.js" defer></script>
  <script src="/static/vendor/purify.min.js" defer></script>
  <script type="module" src="/static/js/share.js"></script>
</head>
<body class="share-body">
  <header class="share-head"><b>PaperLab</b><span class="small muted" data-label></span><span class="spacer"></span>
    <span class="small muted share-hint" data-hint>글을 골라 의견을 남기거나 직접 고칠 수 있어요 · 남긴 내용은 빨간색으로 보여요</span></header>
  <main class="share-main">
    <article class="doc share-doc" data-doc><p class="muted">불러오는 중…</p></article>
    <aside class="share-side" data-side hidden>
      <h3>의견 <span data-count></span></h3>
      <ol class="share-comments" data-comments></ol>
      <form class="share-form" data-form>
        <blockquote class="share-quote" data-quote hidden></blockquote>
        <label class="share-edit" data-edit hidden><span class="small">고친 글</span>
          <textarea class="input" name="replacement" rows="4" maxlength="4000"></textarea></label>
        <input class="input" name="author" maxlength="40" placeholder="이름 (예: 김교수)" required />
        <textarea class="input" name="body" rows="4" maxlength="4000" placeholder="의견을 적어 주세요. 본문에서 문장을 고르면 그 문장에 달려요." required></textarea>
        <div class="row" style="gap:6px"><button class="btn primary" type="submit" data-submit>의견 남기기</button>
          <button class="btn" type="button" data-clear-quote hidden>고른 문장 빼기</button></div>
      </form>
    </aside>
  </main>
  <div class="share-pick" data-pick hidden><button type="button" class="btn sm primary" data-how="comment">의견 달기</button>
    <button type="button" class="btn sm" data-how="edit">고치기</button></div>
  <div id="toasts"></div>
</body>
</html>
